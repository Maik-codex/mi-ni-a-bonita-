<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mi niña bonita</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff9ad5;--pink2:#ff4fb0;--blue:#7fc8ff;--lilac:#c9a6ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:'Quicksand',system-ui,sans-serif;overflow:hidden}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity 1s}
.hidden{opacity:0;pointer-events:none}
h1{font-family:'Great Vibes','Dancing Script',cursive;font-weight:400;font-size:clamp(52px,14vw,110px);color:var(--pink);
 text-shadow:0 0 8px var(--pink2),0 0 22px var(--pink2),0 0 48px #ff2d9b;animation:pulse 3s ease-in-out infinite;line-height:1.1}
@keyframes pulse{50%{text-shadow:0 0 12px var(--pink2),0 0 34px var(--pink2),0 0 70px #ff2d9b;transform:scale(1.03)}}
#frase{font-family:'Dancing Script',cursive;font-size:clamp(17px,4.4vw,24px);color:#f3d9ea;max-width:560px;margin-top:26px;line-height:1.55;min-height:9em;text-shadow:0 0 8px rgba(255,120,200,.5)}
.btn{margin-top:22px;font-family:'Quicksand',sans-serif;font-weight:600;letter-spacing:.12em;font-size:18px;color:#fff;background:rgba(255,255,255,.05);
 border:1.5px solid var(--pink);border-radius:999px;padding:13px 44px;cursor:pointer;box-shadow:0 0 14px var(--pink2),inset 0 0 14px rgba(255,79,176,.35);transition:.25s;opacity:0}
.btn.show{opacity:1}
.btn:hover{transform:scale(1.06);box-shadow:0 0 26px var(--pink2),inset 0 0 20px rgba(255,79,176,.55)}
#lyrics{width:min(760px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
.line{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(26px,7vw,48px);line-height:1.25;transition:opacity .8s,filter .8s,transform .8s}
.line.old1{opacity:.4;filter:blur(.4px);transform:scale(.88)}
.line.old2{opacity:.18;filter:blur(1.5px);transform:scale(.8)}
.line .c{opacity:0;transition:opacity .05s}
.line .c.on{opacity:1}
.w0{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.7)}
.w1{color:var(--pink);text-shadow:0 0 12px var(--pink2)}
.w2{color:var(--blue);text-shadow:0 0 12px #3aa9ff}
.w3{color:var(--lilac);text-shadow:0 0 12px #9a63ff}
#top{position:fixed;top:12px;left:0;right:0;text-align:center;z-index:2;font-family:'Great Vibes',cursive;font-size:30px;color:var(--pink);text-shadow:0 0 14px var(--pink2);opacity:0;transition:opacity 1.5s}
#top.on{opacity:.9}
#bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--pink2),var(--blue));box-shadow:0 0 10px var(--pink2);z-index:3}
#msg{position:fixed;bottom:16px;left:0;right:0;text-align:center;z-index:3;font-size:13px;color:#ff9a9a}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="screen" id="intro">
  <h1>mi niña bonita</h1>
  <div id="frase"></div>
  <button class="btn" id="go">escuchar</button>
</div>

<div class="screen hidden" id="stage"><div id="lyrics"></div></div>
<div id="top">mi niña bonita</div>
<div id="bar"></div>
<div id="msg"></div>
<audio id="player" preload="auto" playsinline></audio>

<script>
/* ============================================================
   ✏️  ZONA PARA EDITAR  (solo cambia estas dos cosas)
   ============================================================ */

// 1) LINK DE LA CANCIÓN: pega aquí el link directo al archivo de audio (.mp3).
//    También sirve un archivo en la misma carpeta, por ejemplo: "cancion.mp3"
const CANCION_URL = "https://www.image2url.com/r2/default/audio/1795706782491-7f111280-91f7-4079-aa65-32855034d40b.mp3";
// Segundos que la letra se adelanta. Si sale tarde, súbelo; si sale antes de tiempo, bájalo.
const ADELANTO = 7.1;
// Segundos por letra al escribir. Menor = más rápido, mayor = más lento.
// Pon 0 para que cada frase se escriba usando todo el tiempo hasta la siguiente.
const SEG_POR_LETRA = 2.9;
// Qué parte del tiempo hasta la siguiente frase se usa para escribirla (0.5 = la mitad).
const FIN_ESCRITURA = 1.0;
// 2) LETRA DE LA CANCIÓN: pégala entre las comillas invertidas ` `
//    Una frase por línea.
//    Opción A (sincronización exacta): con tiempos, así:
//        [00:12.50] primera frase
//        [00:17.80] segunda frase
//    Opción B (automática): sin tiempos, solo las frases; se reparten por toda
//    la canción (puede quedar un poco desfasada).
const LETRA = `
Representando al regional mexicano
Richy Peña
Chino. Y Nacho. Darrelles
Esta canción nació de un pensamiento
¿Es así? Y yo solo pienso en ti
Mi niña bonita, mi amor
Tú reconoces mi tono cuando lo oyes
Lo que siento por ti,es ternura y pasión
Tú me haz hecho  sentir
que hay en mi corazón
tanto amoooooooooooooooooooooor,
tanto amooooooooooooooooooooooooooooooor
...
Yo nací para ti
.......
tú también para mí
.......
Y ahora sé que morir es tratar de vivir
...
sin tu amooooooooooooooooooor
...................
sin tu amoooooooooooooooooooooor
..................
Mi niña bonita, mi dulce princesa
Me siento en las nubes
cuando tú me besas
Y siento que vuelo más alto que el cielo
si tengo de cerca el olor de tu pelo
..............
Mi niña bonita, brillante lucero
.......................
Te queda pequeña la frase "te quiero"
....................
Por eso mis labios te dicen "te amo"
....
Cuando estamos juntos
.....
más nos enamoramos
....
Aquí hay amoooooooooooooooooooooooooor
Aquí hay amooooooooor
................................
Aquí hay amor, amor
...
Aquí hay amor, amor
...
Aquí hay, hay, hay, hay, hay amor
Que este amor como tú más sube
Que cuando te tomo de la
mano por el parque camino
en las nubes. Parece mentira que ya
no recuerdo nada cuando solo estuve
Nada se podrá comparar
con algo tan especial
Nada se compara con lo nuestro
Le agradezco al tiempo.
Me ha demostrado
que las cosas buenas llegan
en cualquier momento
Yo no imaginaba que conocería
algún día este sentimiento
Un amor puro y natural,
digno de admirar
Digno de admirar, princesa
Un mundo de fantasía
lleno de romance y alegría
De bellos detalles cada día. Nena
¿quién lo diría?
Que de ti yo me enamoraría
y que sin tu amor no viviría
¿Cómo sabría que esto pasaría,
que ibas a ser mía y que yo querría
Amarte por siempre, mi niña bonita
Mi niña bonita
Mi niña bonita, mi dulce princesa
Me siento en las nubes
cuando tú me besas
Y siento que vuelo más alto que el cielo
si tengo de cerca el olor de tu pelo
Mi niña bonita, brillante lucero
Te queda pequeña la frase "te quiero"
Por eso mis labios te dicen "te amo"
Cuando estamos juntos
más nos enamoramos
Aquí hay amor
Mi niña bonita
Aquí hay amor
Mi niña bonita
Aquí hay amor
amor. Aquí hay amor, amor
...............
Aquí hay, hay, hay, hay, hay
amor
Así es, compa
Desde este momento no
podrás sacar esta canción de
tu cabeza. Chino y Nacho. Y Darrelles
Mi niña bonita, Richy Peña
Tú y únicamente tú
Mi niña bonita
Y fierro
Esto es un "hit" mundial
Más nada digo
`;

/* ============================================================
   Desde aquí no hace falta tocar nada
   ============================================================ */
const FRASE="A veces, para otras personas hay cosas que parecen tan pequeñas e insignificantes, como una carta, una canción… cosas tan pequeñas pero que significan mucho para nosotros, por eso te dedico esta canción mi niña linda 💙";
const $=id=>document.getElementById(id);

// Destellos y corazones
const cv=$('fx'),cx=cv.getContext('2d');let W,H,stars=[],hearts=[],pulse=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',rs);rs();
const cols=['255,154,213','127,200,255','255,255,255','201,166,255'];
for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:Math.random()*.03+.01,c:cols[i%4]});
function fx(){
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    s.p+=s.s;const a=(Math.sin(s.p)+1)/2;
    cx.beginPath();cx.fillStyle=`rgba(${s.c},${.15+a*.85})`;cx.shadowColor=`rgb(${s.c})`;cx.shadowBlur=6+pulse*10;
    cx.arc(s.x,s.y,s.r*(1+pulse*.4),0,6.28);cx.fill();
  }
  cx.shadowBlur=0;
  if(Math.random()<.03+pulse*.04&&hearts.length<25)hearts.push({x:Math.random()*W,y:H+20,v:Math.random()*.8+.4,sz:Math.random()*10+8,p:Math.random()*6});
  cx.textAlign='center';
  for(let i=hearts.length-1;i>=0;i--){
    const h=hearts[i];h.y-=h.v;h.p+=.03;h.x+=Math.sin(h.p)*.5;
    cx.globalAlpha=Math.max(0,Math.min(.55,h.y/H));cx.font=h.sz+'px serif';cx.fillText('💙',h.x,h.y);
    if(h.y<-20)hearts.splice(i,1);
  }
  cx.globalAlpha=1;requestAnimationFrame(fx);
}
fx();

// Frase inicial letra por letra
(function(){let i=0;const el=$('frase');
  (function t(){el.textContent=FRASE.slice(0,i++);
    if(i<=FRASE.length)setTimeout(t,45);else $('go').classList.add('show');})();
})();

const player=$('player');let lines=[],cur=-1,running=false;

function parse(raw,dur){
  const rows=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const re=/^\[(\d+):(\d+(?:[.,]\d+)?)\]\s*(.*)$/;
  const timed=rows.filter(r=>re.test(r)).length>rows.length/2;
  const out=[];
  if(timed){
    for(const r of rows){const m=r.match(re);if(!m||!m[3])continue;out.push({t:+m[1]*60+parseFloat(m[2].replace(',','.')),text:m[3]})}
    out.sort((a,b)=>a.t-b.t);
  }else{
    const clean=rows.filter(r=>!/^\[.*\]$/.test(r));
    const lead=Math.min(8,dur*.05),span=dur-lead-6;
    const tot=clean.reduce((a,r)=>a+r.length+8,0);let t=lead;
    for(const r of clean){out.push({t,text:r});t+=span*(r.length+8)/tot}
  }
  return out;
}

$('go').onclick=async()=>{
  $('intro').classList.add('hidden');$('stage').classList.remove('hidden');$('top').classList.add('on');
  player.src=CANCION_URL;
  player.onerror=()=>{$('msg').textContent='No se pudo cargar la canción (revisa el link).'};
  if(!player.duration||!isFinite(player.duration))
    await new Promise(r=>{player.onloadedmetadata=r;player.onerror=r;setTimeout(r,4000)});
  lines=parse(LETRA,player.duration||200);
  cur=-1;running=true;
  try{await player.play()}catch(e){$('msg').textContent='No se pudo reproducir el audio (revisa el link).'}
  loop();
};

function build(i){
  const L=$('lyrics');
  const div=document.createElement('div');div.className='line';div.id='l'+i;
  const words=lines[i].text.split(/\s+/);
  words.forEach((w,wi)=>{
    const wc=document.createElement('span');
    const r=(wi*7+i*3)%10;wc.className='w'+(r<4?0:r<6?1:r<8?2:3);
    wc.style.whiteSpace='nowrap';
    for(const ch of w){const s=document.createElement('span');s.className='c';s.textContent=ch;wc.appendChild(s)}
    div.appendChild(wc);if(wi<words.length-1)div.appendChild(document.createTextNode(' '));
  });
  L.appendChild(div);
  while(L.children.length>3)L.removeChild(L.firstChild);
  [...L.children].reverse().forEach((c,j)=>{c.classList.toggle('old1',j===1);c.classList.toggle('old2',j>=2)});
}

function loop(){
  if(!running)return;
  const t=player.currentTime+ADELANTO;
  let idx=-1;for(let i=0;i<lines.length;i++){if(lines[i].t<=t)idx=i;else break}
  if(idx!==cur){
    if(idx<cur||idx-cur>1){
      $('lyrics').innerHTML='';
      for(let j=Math.max(0,idx-2);j<idx;j++){build(j);document.querySelectorAll('#l'+j+' .c').forEach(c=>c.classList.add('on'))}
    }
    if(idx>=0)build(idx);cur=idx;
  }
  if(cur>=0){
    const nx=lines[cur+1]?lines[cur+1].t:lines[cur].t+5;
  const gap=nx-lines[cur].t;
  const dur=SEG_POR_LETRA>0
  ? Math.max(.4,Math.min(gap*FIN_ESCRITURA,lines[cur].text.length*SEG_POR_LETRA))
  : Math.max(.4,gap*FIN_ESCRITURA);
    const cs=document.querySelectorAll('#l'+cur+' .c');
    const n=Math.ceil(Math.min(1,(t-lines[cur].t)/dur)*cs.length);
    cs.forEach((c,i)=>c.classList.toggle('on',i<n));
  }
  // brillo suave que late con el tiempo mientras suena
  const target=player.paused?0:(Math.sin(t*6.5)+1)/4;
  pulse+=(target-pulse)*.1;
  if(player.duration)$('bar').style.width=(t/player.duration*100)+'%';
  requestAnimationFrame(loop);
}
player.onended=()=>{
  running=false;
  $('lyrics').innerHTML='<div class="line w1" style="font-size:clamp(34px,9vw,60px)">te quiero mucho 💙</div>';
};
</script>
</body>
</html>
